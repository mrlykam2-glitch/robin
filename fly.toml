# Fly.io deploy config for Robin.
# Deploy: install flyctl, run `fly auth login`, then `fly launch --copy-config --no-deploy`
# (pick a unique app name), set secrets with `fly secrets set OPENAI_API_KEY=...`,
# and finally `fly deploy`. Fly serves the app at https://<app-name>.fly.dev.
# Rename the app below to a globally-unique value before deploying.
app = "robin-osint"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/_stcore/health"
